spring.application.name=campusq-backend

# Server Configuration
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# MySQL Database Configuration (override via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (JWT_SECRET must be a Base64-encoded 256-bit+ key)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Google Sign-In (optional; set GOOGLE_CLIENT_ID to enable)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Super Admin Bootstrap (set via environment variables)
app.super-admin.email=${CAMPUSQ_SUPER_ADMIN_EMAIL:}
app.super-admin.password=${CAMPUSQ_SUPER_ADMIN_PASSWORD:}

# CORS Configuration (comma-separated allowed frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.campusq=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
